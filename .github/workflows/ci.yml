name: CI

on:
  push:
    branches:
      - feat/portfolio-christian
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, lint, validation, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate

      - name: Type-check without emitting files
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate content, audio, deployment policy, and public files
        run: npm run validate

      - name: Build production output
        run: npm run build
